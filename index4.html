<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Operações JavaScript</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 20px;
        }

        .container {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            width: 400px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.2);
        }

        input {
            width: 95%;
            padding: 8px;
            margin-bottom: 15px;
        }

        button {
            padding: 10px;
            background-color: blue;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        .resultado {
            margin-top: 20px;
            background-color: #eee;
            padding: 15px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="container">

        <h1>Calculadora JavaScript</h1>

        <label>Digite o valor de A:</label>
        <input type="number" id="a">

        <label>Digite o valor de B:</label>
        <input type="number" id="b">

        <label>Digite a nota:</label>
        <input type="number" id="nota">

        <label>Digite a frequência:</label>
        <input type="number" id="frequencia">

        <button onclick="calcular()">Calcular</button>

        <div class="resultado" id="resultado"></div>

    </div>

    <!-- Ligação com o arquivo JavaScript -->
    <script src="script.js"></script>

</body>
</html>
